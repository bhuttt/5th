<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渤海大学乒乓球队第五届总结大赛官方主页</title>
    <script src="https://cdn.jsdelivr.net/npm/hydrogen-js-sdk@2.2.3/dist/Bmob-2.2.3.min.js"></script>
    <style>
        /* ================== 1. 全局样式与沉浸式视觉 ================== */
        @font-face {
            font-family: 'ZhongShan';
            src: url('./zhongshan.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            --gradient-orange: linear-gradient(135deg, #FF512F 0%, #F09819 100%);
            --gradient-coral: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%);
            --bg-light: #FDF8F4; 
            --text-main: #2A1B18; 
            --text-light: #8A736E;
            --white-glass: rgba(255, 255, 255, 0.65);
            --border-glass: rgba(255, 255, 255, 0.6);
            --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.05);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
        
        body { 
            background-color: var(--bg-light); color: var(--text-main); line-height: 1.6; padding-top: 75px;
            background-image: radial-gradient(at 0% 0%, rgba(255, 81, 47, 0.15) 0px, transparent 60%);
            background-attachment: fixed;
        }

        /* ================== 2. 导航栏系统 ================== */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(253, 248, 244, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-glass);
            z-index: 1000; display: flex; overflow-x: auto; padding: 0 15px;
        }
        .navbar::-webkit-scrollbar { display: none; }
        .nav-links { display: flex; gap: 8px; padding: 16px 0; margin: 0 auto;}
        
        .nav-item {
            color: var(--text-light); text-decoration: none; font-weight: 600; font-size: 15px; padding: 8px 18px; border-radius: 30px;
            cursor: pointer; transition: var(--transition);
        }
        .nav-item.active { background: var(--gradient-orange); color: white; box-shadow: 0 4px 12px rgba(255, 81, 47, 0.3); }

        /* ================== 3. 页面框架 ================== */
        .hero { margin: 20px auto 0; max-width: 900px; padding: 0 20px; }
        .hero-card {
            background: var(--gradient-coral); border-radius: 30px; padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(255, 65, 108, 0.25);
            display: flex; align-items: center; justify-content: center; gap: 25px;
            color: white; flex-wrap: wrap; text-align: left;
        }
        .team-logo { width: 100px; height: 100px; border-radius: 50%; background: white; padding: 8px; object-fit: contain; }
        .hero-text h1 { font-family: 'ZhongShan', sans-serif; font-size: 3rem; line-height: 1.1; }

        .container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
        .page-section { display: none; animation: slideUp 0.5s ease; }
        .page-section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { 
            background: var(--white-glass); backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass); border-radius: 24px; padding: 35px; box-shadow: var(--shadow-soft); margin-bottom: 30px; 
        }
        .card-header { font-size: 1.6rem; color: var(--text-main); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; font-weight: 800; }
        .card-header::before { content: ''; width: 6px; height: 24px; background: var(--gradient-orange); border-radius: 6px; }

        /* ================== 4. 报名表单样式 ================== */
        .reg-label { display: block; margin-bottom: 8px; font-size: 0.95rem; font-weight: bold; color: var(--text-light); margin-top: 15px; }
        .login-input { padding: 14px; border-radius: 12px; border: 1px solid #ddd; background: #fafafa; font-size: 15px; width: 100%; outline: none; }
        .login-input:focus { border-color: #FF512F; box-shadow: 0 0 0 3px rgba(255,81,47,0.1); }
        .login-btn { background: var(--gradient-orange); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 20px;}
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,81,47,0.2); }

        .photo-upload-zone {
            width: 150px; height: 210px; border: 2px dashed #cbd5e1; border-radius: 16px; margin: 20px auto; 
            display: flex; align-items: center; justify-content: center; background: #fff; cursor: pointer; overflow: hidden;
        }
        .photo-upload-zone img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .placeholder { text-align: center; color: #94a3b8; font-size: 0.9rem; }

        /* ================== 5. 后台管理样式 ================== */
        .sys-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .sys-item { background: white; border: 2px solid #f1f5f9; border-radius: 20px; padding: 30px 10px; text-align: center; cursor: pointer; transition: 0.4s; }
        .sys-item:hover { border-color: #FF512F; transform: scale(1.03); }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-links">
        <a class="nav-item" href="#home" id="nav-home">首页</a>
        <a class="nav-item" href="#register" id="nav-register">赛事报名</a>
        <a class="nav-item" href="#draw" id="nav-draw">后台管理</a>
        <a class="nav-item" href="#trophies" id="nav-trophies">荣誉殿堂</a>
    </div>
</nav>

<header class="hero">
    <div class="hero-card">
        <img src="./logo.png" alt="Logo" class="team-logo" onerror="this.style.display='none'">
        <div class="hero-text">
            <h1>渤海大学乒乓球队</h1>
            <p>第五届总结大赛官方主页 | 2017 - 2026</p>
        </div>
    </div>
</header>

<div class="container">
    <div id="home" class="page-section active">
        <div class="card" style="background: rgba(42, 27, 24, 0.8); color: white; border: none;">
            <h2 class="card-header" style="color: white;">距开幕式倒计时</h2>
            <div id="countdown-display" style="font-size: 2.5rem; font-weight: 900; text-align: center; letter-spacing: 2px;">
                <span id="days">00</span>天 <span id="hours">00</span>: <span id="mins">00</span>: <span id="secs">00</span>
            </div>
        </div>
        <div class="card">
            <h2 class="card-header">大赛简介</h2>
            <p>自2017年建队至今，渤海大学乒乓球队已走过九载春秋。本次第五届总结大赛，不仅是竞技的赛场，更是新老渤乒人的荣耀集结...</p>
        </div>
    </div>

    <div id="register" class="page-section">
        <div class="card">
            <h2 class="card-header">选手报名</h2>
            
            <div id="reg-step-1">
                <form id="base-info-form" onsubmit="toStep2(event)">
                    <label class="reg-label">真实姓名</label>
                    <input type="text" id="reg-name" class="login-input" placeholder="请输入姓名" required>
                    
                    <label class="reg-label">代表学院</label>
                    <select id="reg-college" class="login-input" required>
                        <option value="数学科学学院">数学科学学院</option>
                        <option value="控制科学与工程学院">控制科学与工程学院</option>
                        <option value="计算机科学与人工智能学院">计算机科学与人工智能学院</option>
                        <option value="文学院">文学院</option>
                        <option value="物理科学与技术学院">物理科学与技术学院</option>
                        <option value="法学院">法学院</option>
                        <option value="个人">个人</option>
                        </select>

                    <label class="reg-label">打法类型</label>
                    <select id="reg-style" class="login-input" required>
                        <option value="右手横板">右手横板</option>
                        <option value="左手横板">左手横板</option>
                        <option value="右手直板">右手直板</option>
                        <option value="左手直板">左手直板</option>
                        <option value="直板长胶/生胶">直板长胶/生胶</option>
                    </select>
                    <button type="submit" class="login-btn">下一步：上传免冠照</button>
                </form>
            </div>

            <div id="reg-step-2" style="display:none; text-align:center;">
                <p class="reg-label">📸 请上传 1 寸近期免冠照（用于精英卡制作）</p>
                <div class="photo-upload-zone" onclick="document.getElementById('img-file').click()">
                    <div id="ph-inner" class="placeholder">点击选择照片</div>
                    <img id="ph-preview" src="">
                </div>
                <input type="file" id="img-file" hidden accept="image/*" onchange="handleFile(this)">
                <button onclick="commitToCloud()" class="login-btn" style="max-width:300px;">确认提交并归档</button>
            </div>

            <div id="reg-loading" style="display:none; text-align:center; padding: 40px 0;">
                <div style="font-size:3rem; animation: spin 1s linear infinite; display:inline-block;">⌛</div>
                <p id="load-text" style="margin-top:15px; font-weight:bold; color:#E65100;">正在建立云端图片链接...</p>
            </div>

            <div id="reg-done" style="display:none; text-align:center; padding: 30px 0;">
                <div style="font-size:5rem;">🏆</div>
                <h3 style="color:#FF512F; font-size:2rem;">报名成功！</h3>
                <p>您的资料与照片已成功录入渤乒第五届大赛精英库。</p>
                <button onclick="location.reload()" class="login-btn" style="background:#e2e8f0; color:#475569; width:200px; margin-top:20px;">返回</button>
            </div>
        </div>
    </div>

    <div id="draw" class="page-section">
        <div id="admin-login" class="card" style="text-align:center;">
            <h2 class="card-header" style="justify-content:center;">身份验证</h2>
            <input type="password" id="adm-pwd" class="login-input" style="max-width:260px; text-align:center;" placeholder="输入组委会安全码">
            <button class="login-btn" onclick="verifyAdmin()" style="max-width:200px;">登录控制台</button>
        </div>

        <div id="admin-board" style="display:none;">
            <div class="card">
                <h2 class="card-header">管理核心</h2>
                <div class="sys-grid">
                    <div class="sys-item" onclick="doExport()" style="border-color: #FF512F;">
                        <span style="font-size:2.5rem;">📊</span>
                        <div style="font-weight:bold; color:#FF512F; margin-top:10px;">导出全员大名单</div>
                    </div>
                    <div class="sys-item" onclick="alert('抽签模块将在名单确认后开启')">
                        <span style="font-size:2.5rem;">🎲</span>
                        <div style="margin-top:10px;">自动分组抽签</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ================== 核心 1：初始化 Bmob SDK ==================
    // 这是解决跨设备、解决照片转链接的关键
    Bmob.initialize("2f8e8878894199f42e2a5991d48ab233", "9eaf6a2ec3dea2e9378764f89dc4737a");

    // ================== 核心 2：路由与倒计时 ==================
    const targetDate = new Date("Jun 14, 2026 10:00:00").getTime();
    function runTimer() {
        const now = new Date().getTime();
        const gap = targetDate - now;
        if (gap > 0) {
            document.getElementById("days").innerText = Math.floor(gap / 86400000);
            document.getElementById("hours").innerText = ('0' + Math.floor((gap % 86400000) / 3600000)).slice(-2);
            document.getElementById("mins").innerText = ('0' + Math.floor((gap % 3600000) / 60000)).slice(-2);
            document.getElementById("secs").innerText = ('0' + Math.floor((gap % 60000) / 1000)).slice(-2);
        }
    }
    setInterval(runTimer, 1000);

    function route() {
        const hash = window.location.hash.replace('#', '') || 'home';
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(hash)?.classList.add('active');
        document.getElementById('nav-' + hash)?.classList.add('active');
    }
    window.onhashchange = route;
    route();

    // ================== 核心 3：照片转链接与云端存储逻辑 ==================
    let regData = {};
    let uploadFile = null;

    function toStep2(e) {
        e.preventDefault();
        regData = {
            name: document.getElementById('reg-name').value,
            college: document.getElementById('reg-college').value,
            style: document.getElementById('reg-style').value,
            regDate: new Date().toLocaleString()
        };
        document.getElementById('reg-step-1').style.display = 'none';
        document.getElementById('reg-step-2').style.display = 'block';
    }

    function handleFile(input) {
        if (input.files && input.files[0]) {
            uploadFile = input.files[0];
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('ph-preview').src = e.target.result;
                document.getElementById('ph-preview').style.display = 'block';
                document.getElementById('ph-inner').style.display = 'none';
            }
            reader.readAsDataURL(uploadFile);
        }
    }

    function commitToCloud() {
        if (!uploadFile) return alert("⚠️ 请先上传照片！");
        
        document.getElementById('reg-step-2').style.display = 'none';
        document.getElementById('reg-loading').style.display = 'block';
        const st = document.getElementById('load-text');

        // 第一步：利用 SDK 强制上传图片，换取真实的图片 URL
        st.innerText = "正在打通云端通道，转换照片链接...";
        const bmobFile = Bmob.File(uploadFile.name, uploadFile);
        
        bmobFile.save().then(res => {
            const finalPhotoUrl = res[0].url; // 获取到了实打实的 HTTP 图片链接
            st.innerText = "链接转换成功，正在归档资料...";
            
            // 第二步：将姓名学院等文字，与转换好的图片链接绑定，存入数据库
            const query = Bmob.Query('PlayerReg');
            query.set("name", regData.name);
            query.set("college", regData.college);
            query.set("style", regData.style);
            query.set("regTime", regData.regDate);
            query.set("photoUrl", finalPhotoUrl); // 这里存入的是链接字符串
            return query.save();
        }).then(res => {
            document.getElementById('reg-loading').style.display = 'none';
            document.getElementById('reg-done').style.display = 'block';
        }).catch(err => {
            alert("❌ 失败：请检查网络或照片格式。");
            document.getElementById('reg-loading').style.display = 'none';
            document.getElementById('reg-step-2').style.display = 'block';
        });
    }

    // ================== 核心 4：后台管理与名单导出 ==================
    function verifyAdmin() {
        if (document.getElementById('adm-pwd').value === '11111111') {
            document.getElementById('admin-login').style.display = 'none';
            document.getElementById('admin-board').style.display = 'block';
        } else alert("口令错误！");
    }

    function doExport() {
        alert("系统正在深度拉取云端照片链接，请稍候...");
        const query = Bmob.Query('PlayerReg');
        query.limit(1000);
        query.find().then(results => {
            if (!results.length) return alert("目前空空如也！");
            
            // 构建 CSV，最后一列是真实的图片链接
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF报名时间,姓名,学院,打法,照片下载链接\n";
            results.forEach(p => {
                csvContent += `${p.regTime},${p.name},${p.college},${p.style},${p.photoUrl || "无链接"}\n`;
            });
            
            const link = document.createElement("a");
            link.href = encodeURI(csvContent);
            link.download = "第五届总结大赛_全体名单_含图.csv";
            link.click();
        });
    }
</script>
</body>
</html>
